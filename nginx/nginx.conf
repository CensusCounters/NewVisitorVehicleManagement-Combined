# Port 80 only redirects. The application is served on 443 at /censusvv/.
server {
    listen 80;
    server_name _;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name _;

    ssl_certificate /etc/nginx/ssl/nginx.crt;
    ssl_certificate_key /etc/nginx/ssl/nginx.key;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    open_file_cache max=1000 inactive=20s;
    open_file_cache_valid 30s;
    open_file_cache_min_uses 2;

    client_max_body_size 2G;

    # These files are replaced or deleted, so browsers must not keep them.
    location /censusvv/static/images/uploads/ {
        alias /var/www/static/images/uploads/;
        add_header Cache-Control "no-store" always;
    }

    location /censusvv/static/anpr_vehicles/ {
        alias /var/www/static/anpr_vehicles/;
        add_header Cache-Control "no-store" always;
    }

    location /censusvv/static/reports/ {
        alias /var/www/static/reports/;
        add_header Cache-Control "no-store" always;
    }

    # Shipped files and captured images. Shipped URLs carry a per-file version,
    # and captured filenames are unique, so immutable is safe.
    location /censusvv/static/ {
        alias /var/www/static/;
        add_header Cache-Control "public, max-age=2592000, immutable" always;
        access_log off;
    }

    location = / {
        return 301 /censusvv/;
    }

    location = /censusvv {
        return 301 /censusvv/;
    }

    location /censusvv/ {
        resolver 127.0.0.11 valid=10s ipv6=off;
        set $upstream https://census_counters_webservice_fr:4001;
        # Drop /censusvv before Flask sees the request. X-Forwarded-Prefix puts it back
        # into the links Flask generates.
        rewrite ^/censusvv/?(.*)$ /$1 break;
        proxy_pass $upstream;
        proxy_ssl_verify off;
        proxy_ssl_server_name on;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Prefix /censusvv;
        proxy_read_timeout 300s;
        proxy_connect_timeout 75s;
    }
}
