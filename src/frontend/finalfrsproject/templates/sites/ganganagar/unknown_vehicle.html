{% extends "layout.html" %}
{% block content %}
<section class="user vehicle_detail_section">
	<div class="container">
		<div class="row d-flex align-items-stretch" id="img-vg-content">
			<div class="col-md-4 d-flex">
				<div class="user_left_portion preview-panel minimal-preview-panel known-vehicle-tall-panel" id="capturedImageRow"
					style="flex: 1; background: linear-gradient(to right, #900C3F 0%, #C70039 41%, #581845 100%); padding: 20px;">
					{% if details.vehicle_image_url %}
					<h1 class="preview-panel-title">Vehicle Picture</h1>
					<div class="preview-image-frame preview-image-frame--compact preview-image-frame--clickable minimal-preview-frame known-vehicle-tall-frame">
						<img src="{{ details.vehicle_image_url }}" name="vehicle_image" id="vehicle_image" class="is-clickable"
							onclick='javascript:showVehicleImageModal("Vehicle Picture", {{ details.vehicle_image_url|tojson }})'>
					</div>
					{% endif %}
			  </div>
			</div>
			<div class="col-md-8">
				<div class="user-form row">
					<h1 style="margin-bottom: 30px;">Vehicle Details</h1>
					<form id="vehicle_details" action="{{ url_for('unknown_vehicle') }}" method="post" enctype="multipart/form-data" class="login">
						<input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
						<input type="hidden" name="person_id" id="person_id" value="{{ details.person_id }}">
						{% if details.vehicle_image_url %}
						<input type="hidden" name="vehicle_image" value="{{ details.vehicle_image_url }}">
						{% endif %}
						{% if details.vehicle_id is not none %}
						<input type="hidden" id="vehicle_id" name="vehicle_id" value="{{ details.vehicle_id | trim }}">
						{% endif %}
						<div class="col-xs-2">
							<label class="label">Vehicle Number</label>
						</div>
						<div class="form-group col-xs-10">
							<input id="vehicle_number" name="vehicle_number" type="text" maxlength="30" class="form-control required"
								   value="{{ details.vehicle_number.strip() }}">
					  	</div>
						<div class="col-xs-2">
							<label class="label">Owner</label>
						</div>
						<div class="form-group col-xs-10">
							<input id="vehicle_owner_name" name="vehicle_owner_name" type="text" maxlength="30" class="form-control required" value="{{ details.vehicle_owner_name }}">
						</div>
						<div class="col-xs-2">
							<label class="label">M/T</label>
						</div>
					  	<div class="form-group col-xs-10">
							<input id="vehicle_make" name="vehicle_make" type="text" maxlength="30" class="form-control" value="{{ details.vehicle_make if details.vehicle_make else '' }}">
					  	</div>
						<div class="col-xs-2">
							<label class="label">Color</label>
						</div>
					  	<div class="form-group col-xs-10">
							<input id="vehicle_color" name="vehicle_color" type="text" maxlength="30" class="form-control" value="{{ details.vehicle_color if details.vehicle_color else '' }}">
					  	</div>
						<div class="col-xs-6 buttons text-center" style="margin-top:10px">
						   <button type="submit" id = "sbmt_button" name="sbmt_button" value="back_to_select" class="btn btn-primary">Submit to Add Vehicle</button>
						</div>
						<div class="col-xs-6 buttons text-center" style="margin-top:10px">
						  <button type="button" id ="cancelbtn" name="cancelbtn" class="btn btn-primary" style="color:#dddddd">Go Back</button>
						</div>
						<div id="spinner" class="spinner-overlay" style="display:none;">
							<div class="spinner"></div>
						</div>
					</form>
				</div>
			</div>
		</div>
	  </div>
	<div id="unknownVehicleImageModal" class="modal image-preview-modal">
		<span id="unknownVehicleImageModalClose" class="close">&times;</span>
		<img class="modal-content image-preview-modal-content" id="unknownVehicleImageModalImg">
		<div id="unknownVehicleImageModalCaption" class="image-preview-modal-caption"></div>
	</div>
	</section>
<script>
	var details = {{ details | tojson }};
    console.log(details);

	function showVehicleImageModal(label, image) {
		var imageModal = document.getElementById('unknownVehicleImageModal');
		document.getElementById('unknownVehicleImageModalImg').src = image;
		document.getElementById('unknownVehicleImageModalCaption').textContent = label;
		imageModal.style.display = 'block';
	}

	var unknownVehicleImageModal = document.getElementById('unknownVehicleImageModal');
	document.getElementById('unknownVehicleImageModalClose').onclick = function() {
		unknownVehicleImageModal.style.display = 'none';
	};

	window.addEventListener('click', function(event) {
		if (event.target === unknownVehicleImageModal) {
			unknownVehicleImageModal.style.display = 'none';
		}
	});

	$(document).ready(function(){
		$("#cancelbtn").click(function(){
			$("#cancelbtn").data('clicked', true);
				if($('#cancelbtn').data('clicked')) {
					$.ajax({
   							url: "{{ url_for('recognize_vehicle') }}", //"/recognize_vehicle",
    						data: "",
    						type: 'GET',
					    	success: function (resp) {
					        	window.location.href = "/recognize_vehicle"
					    	},
					    	error: function(e) {
					       		alert('Error: '+e);
					    	}  
					});
			}
		});
	});

	$("#vehicle_details").validate({
        errorPlacement: function (error, element)
        {
            element.before(error);
        },
      	rules: { 
    	}
    });

    $("#sbmt").click(function() {
    	if($('#vehicle_details').valid()) {
    		document.getElementById('spinner').style.display = "flex";
    		vehicle_details.submit();
    	}	
    });

</script>
{% endblock content %}
