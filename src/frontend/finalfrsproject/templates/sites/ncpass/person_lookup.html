{% extends "layout.html" %}
{% block content %}
<section class="user user_register_section">
  <div class="container-fluid">
    <form id="form" action="{{ url_for('person_lookup') }}" method="post" enctype="multipart/form-data" class="login">
      <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">

      <!-- Custom File Input -->
      <div class="row" id="img-vg-content1">
        <div id="previewImg">Image preview will appear here</div>
      </div>
      <div class="row" id="img-vg-content2">
        <span id="fileName" style="display: flex; align-items: center; justify-content: center; padding-left: 50px;
         font-size: 20px; margin-top: 30px; color: red">No file chosen</span>
      </div>
      <div class="row" id="img-vg-content3">
          <input type="file" id="imageInput" name="image" accept="image/*" required style="display: none;">
          <button type="button" id="customFileBtn" class="btn btn-primary" style="width:40%">Choose Image</button>
      </div>
      <!-- Submit Button & Spinner -->
      <div class="row" id="img-vg-content4">
        <button type="submit" id="sbmt" class="btn btn-primary" style="display: none;">Submit</button>
        <div id="spinner" class="spinner-overlay" style="display:none;">
          <div class="spinner"></div>
        </div>
      </div>
    </form>
  </div>
</section>

<script>
$(document).ready(function () {
  const imageInput = document.getElementById('imageInput');
  const previewImg = document.getElementById('previewImg');
  const fileNameSpan = document.getElementById('fileName');
  const customFileBtn = document.getElementById('customFileBtn');

  // When the custom button is clicked, trigger file input
  customFileBtn.addEventListener('click', function () {
    imageInput.click();
  });

  // Handle file input change
  imageInput.addEventListener('change', function () {
    const file = this.files[0];
    if (!file) {
      fileNameSpan.textContent = "No file chosen";
      previewImg.innerHTML = "Image preview will appear here";
      $("#sbmt").hide();
      return;
    }

    const MAX_MB = 8;
    if (file.size / 1024 / 1024 > MAX_MB) {
      alert("Image is too large. Please upload an image smaller than " + MAX_MB + "MB.");
      this.value = '';
      fileNameSpan.textContent = "No file chosen";
      previewImg.innerHTML = "Image preview will appear here";
      $("#sbmt").hide();
      return;
    }

    // Update filename
    fileNameSpan.textContent = file.name;

    // Load preview
    const reader = new FileReader();
    reader.onload = function (e) {
      previewImg.innerHTML = `<img src="${e.target.result}" style="max-width: 100%; height: auto;">`;
      $("#sbmt").show();
    };
    reader.readAsDataURL(file);
  });

  // Submit button logic
  $("#form").on('submit', function() {
    $("#spinner").show();
});

});
</script>
{% endblock content %}
