{% extends "layout.html" %}
{% block content %}
  <section class="user login_section" style="padding-top:2em">
    <form id="form" action="{{ url_for('aadhar_lookup') }}" class="login" method="post">
      <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">

      <div class="form-group col-md-12">
        <select name="traveler_type" id="traveler_type" class="form-control">
          <option value="">{{ _('Visitor Type') }}</option>
          {% for value in details.visitor_categories %}
              <option value="{{ value }}">{{ value.replace('_', ' ') }}</option>
          {% endfor %}
        </select>
      </div>

      <div class="form-group col-md-12" id="id_type_wrapper" style="display: block;">
        <select name="id_type" id="id_type" class="form-control">
          <option value="">{{ _('ID Type') }}</option>
          {% for value in details.id_categories %}
              <option value="{{ value }}">{{ value.replace('_', ' ') }}</option>
          {% endfor %}
        </select>
      </div>

      <div class="form-group col-md-12" id="id_number_wrapper" style="display: block;">
        <input id="id_number" name="id_number" type="text" class="form-control" placeholder="{{ _('Enter the id number') }}">
      </div>

      <div class="col-xs-12 buttons text-center">
        <button type="button" id="login" class="c-btn" style="width: 100%;">{{ _('Search') }}</button>
        {% if details.number_of_male_passengers_to_add > 0 %}
          <button type="button" id="skip" class="c-btn" style="width: 100%; background-color: red; color: white; border:none;" onclick="window.location.href='make_trip_summary'">{{ _('Skip') }}</button>
        {% endif %}
      </div>
      <div id="spinner" class="spinner-overlay" style="display: none">
        <div class="spinner"></div>
      </div>
    </form>
  </section>
  <script>

    document.addEventListener("DOMContentLoaded", function () {
        const travelerType = document.getElementById("traveler_type");
        const idTypeWrapper = document.getElementById("id_type_wrapper");
        const idType = document.getElementById("id_type");
        const idNumberWrapper = document.getElementById("id_number_wrapper");

        // Define category groups
        const showIdNumberOnly = ['TEACHER']
        const showIdTypeFirst = ['PASS HOLDER', 'PERMISSION', 'CIVILIAN', 'GUEST', 'OTHERS',];

        // Function to update visibility
        function updateFields() {
            const selectedType = travelerType.value;
            console.log('traveler type: ', selectedType);

            // Reset the ID Type dropdown when the traveler type changes
            $("#id_type").val("");

            // Restore all options first (in case "Pass" was previously hidden)
            $("#id_type option").show();

            if (["CIVILIAN", "PERMISSION", "GUEST", "OTHERS"].includes(selectedType)) {
                $("#id_type option[value='PASS']").hide();
            } else {
                $("#id_type option[value='PASS']").show(); // Restore "PASS" for other traveler types
            }

            if (showIdNumberOnly.includes(selectedType)) {
                idTypeWrapper.style.display = "none";
                idNumberWrapper.style.display = "block"; // Show id_number directly
            } else if (showIdTypeFirst.includes(selectedType)) {
                idTypeWrapper.style.display = "block"; // Show id_type dropdown
                idNumberWrapper.style.display = "none"; // Hide id_number initially
            } else {
                idTypeWrapper.style.display = "none"; // Hide both fields for other cases
                idNumberWrapper.style.display = "none";
            }
        }

        function showIdNumberField() {
            if (idType.value) {
                idNumberWrapper.style.display = "block"; // Show id_number after selecting id_type
            } else {
                idNumberWrapper.style.display = "none"; // Hide if id_type is not selected
            }
        }

        // Attach event listeners
        travelerType.addEventListener("change", updateFields);
        idType.addEventListener("change", showIdNumberField);

        // Initialize fields on page load
        updateFields();
        showIdNumberField();
    });
    $(document).ready(function(){
        $('#form input, #form select').keypress(function(e) {
          if (e.which == 13) {
            e.preventDefault(); // Prevent the form from submitting by default
            $('#login').trigger('click'); // Manually trigger the Search button
          }
      });

        $.validator.addMethod("requireIDType", function(value, element) {
          //return value && value.trim() !== ""; // Require selection for all cases
          let travelerType = $("#traveler_type").val();
          // **Only enforce selection if traveler is NOT a Teacher**
          return travelerType === "TEACHER" || (value && value !== "");
        }, "Please select an ID Type.");


        //['AADHAR', 'DRIVERS LICENSE', 'OTHER']
        $.validator.addMethod("validIDNumber", function(value, element) {
            let idType = $("#id_type").val(); // Get selected ID type
            let cleanedValue = value.replace(/[-\s]/g, ""); // Remove spaces and dashes

            if (idType === "AADHAR") {
                if (!/^[A-Za-z0-9]+$/.test(cleanedValue)) {
                    $.validator.messages.validIDNumber = "Aadhar number can only contain letters and numbers (no spaces or dashes).";
                    return false;
                } else if (cleanedValue.length !== 12) {
                    $.validator.messages.validIDNumber = "Aadhar number must be exactly 12 alphanumeric characters.";
                    return false;
                }
                return true;
            }
            else if (idType === "DRIVERS LICENSE") {
                if (!/^[A-Za-z0-9]+$/.test(cleanedValue)) {
                    $.validator.messages.validIDNumber = "Driver's License number can only contain letters and numbers (excluding spaces and dashes).";
                    return false;
                } else if (cleanedValue.length !== 15) {
                    $.validator.messages.validIDNumber = "Driver's License number must be exactly 15 alphanumeric characters.";
                    return false;
                }
                return true;
            }
            else {
              return true;
            }
        }, function() {
            return $.validator.messages.validIDNumber;
        });

      $("#form").validate({
          rules: {
               traveler_type: {
                  required: true // Enforces a selection
               },
              id_number: {
                  required: true,
                  validIDNumber: true
              },
              id_type: {
                requireIDType: true
              }
          },
          messages: {
              id_number: {
                  required: "Please enter an ID number.",
                  validIDNumber: "ID must match the format for the selected type."
              }
          },
          errorPlacement: function(error, element) {
              error.css({
                  "font-size": "16px",
                  "color": "red",
                  "font-weight": "bold"
              }).insertAfter(element);
          }
      });


      $("#login").click(function() {
        if (!$("#form").valid()) {
          return false;
        }
        $("#spinner").css("display", "flex");  // jQuery version of setting style
        $("#form")[0].submit();                // jQuery selector returns a jQuery object; use [0] to access the raw DOM element
      });
    });
</script>
{% endblock content %}
