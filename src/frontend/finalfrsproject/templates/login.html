{% extends "layout.html" %}
{% block content %}
  <section class="user login_section" style="padding-top:2em">
    <form id="form" action="{{ url_for('login') }}" class="login" method="post">
      <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
      <div class="form-group col-md-8" style="width:100%;text-align:center !important;">
        <input id="username" name="username" type="text" class="form-control" placeholder="{{ _('Enter your username') }}">
      </div>
      <div class="form-group col-md-8" style="width:100%;text-align: center;">
        <input id="password" name="password" type="password" class="form-control required" placeholder="{{ _('Enter your password') }}" value="password">
      </div>
      <!--
      <div class="form-group col-md-8" style="width:100%;text-align: center;">
        <select name="language" id="language" class="form-control" required style="border: 1px solid #00ffe4 !important;">
          <option value="en" style="text-align: left;" {% if details.lang=='en' %}selected{% endif %}>{{ _('English') }}</option>
          <option value="hi" style="text-align: left;" {% if details.lang=='hi' %}selected{% endif %}>{{ _('Hinglish') }}</option>
        </select>
      </div>
      -->
      <div class="col-xs-12 buttons text-center">
        <button type="button" id = "login" class="c-btn" style="width: 100%;">{{ _('Login') }}</button>
      </div>
      <div id="spinner" class="spinner-overlay" style="display:none;">
	    <div class="spinner"></div>
	  </div>
    </form>
  </section>
  
  
  <script>
  $(document).ready(function(){
    /*$(document).keypress(function(e) {
      if(e.which == 13) {
      	$("#login").trigger("click");
      }
    });*/
    $(document).keydown(function(e) {
        if (e.key === "Enter") {
            e.preventDefault(); // Prevent default Enter key action
            $("#login").trigger("click");
        }
    });
    $("#form").validate({
      errorPlacement: function (error, element){ 
        element.before(error);
      },
      rules: {
        username: "required",
        password: "required",
      }
    });
    $("#login").click(function() {
      if($('#form').valid()) {
      	// Show spinner
		document.getElementById('spinner').style.display = "flex";
      	form.submit();
      }
    });

    $('#language').change(function() {
        var selectedLanguage = $(this).val();
        $.ajax({
            url: "{{ url_for('set_language', language='__LANG__') }}".replace('__LANG__', selectedLanguage),
            type: 'GET',
            success: function(response) {
                // Reload the page to reflect the language change
                location.reload();
            },
            error: function(error) {
                // Handle error response if needed
                 alert("{{ _('Error changing language') }}");
             }
         });
     });
  });
</script>
{% endblock content %}
