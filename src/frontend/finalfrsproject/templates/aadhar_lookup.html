{% extends "layout.html" %}
{% block content %}
{% if custom_dropdown %}
  <style>
    .user.login_section .custom-dropdown-wrap {
      position: relative;
      width: 100%;
    }

    .user.login_section #traveler_type,
    .user.login_section #id_number {
      background-color: #000 !important;
      border: 1px solid var(--main-color) !important;
      color: #fff !important;
      box-shadow: none !important;
      outline: none !important;
      font-family: "open-sans", sans-serif !important;
      font-size: 16px !important;
      font-weight: 400 !important;
      font-style: normal;
    }

    .user.login_section #traveler_type {
      cursor: pointer;
      background-image: none !important;
      height: 55px;
      font-size: 16px;
      padding-right: 36px;
      text-transform: none;
    }

    .user.login_section #traveler_type::placeholder,
    .user.login_section #id_number::placeholder {
      font-family: "open-sans", sans-serif !important;
      font-size: 16px !important;
      font-weight: 400 !important;
      color: #fff;
      opacity: 1;
      font-style: italic;
    }

    .user.login_section #traveler_type:focus {
      border-color: var(--main-color) !important;
      box-shadow: 0 0 1pt 1pt var(--main-color) !important;
    }

    .user.login_section .custom-dropdown-caret {
      position: absolute;
      right: 14px;
      top: 50%;
      transform: translateY(-50%);
      pointer-events: none;
      color: var(--main-color);
      font-size: 30px;
      line-height: 1;
    }

    .user.login_section .custom-dropdown-menu {
      position: absolute;
      top: calc(100% + 4px);
      left: 0;
      width: 100%;
      box-sizing: border-box;
      background: #000;
      border: 1px solid var(--main-color);
      border-radius: 0;
      z-index: 1200;
      max-height: 220px;
      overflow-y: auto;
      display: none;
    }

    .user.login_section .custom-dropdown-menu.open {
      display: block;
    }

    .user.login_section .custom-dropdown-item {
      width: 100%;
      text-align: left;
      background: transparent;
      color: #fff;
      border: 0;
      padding: 10px 14px;
      border-bottom: 1px solid rgba(0, 255, 228, 0.15);
      font-size: 16px;
    }

    .user.login_section .custom-dropdown-item:last-child {
      border-bottom: 0;
    }

    .user.login_section .custom-dropdown-item:hover,
    .user.login_section .custom-dropdown-item:focus {
      background: rgba(0, 255, 228, 0.12);
      color: var(--main-color);
      outline: none;
    }
  </style>
  <section class="user login_section" style="padding-top:2em">
    <form id="form" action="{{ url_for('aadhar_lookup') }}" class="login" method="post">
      <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
      <div class="form-group col-md-12 custom-dropdown-wrap" id="traveler_type_wrapper">
        <input
          type="text"
          name="traveler_type"
          id="traveler_type"
          class="form-control"
          value=""
          placeholder="{{ _('Visitor Type') }}"
          readonly
          autocomplete="off"
          aria-haspopup="listbox"
          aria-expanded="false"
        >
        <span class="custom-dropdown-caret">▼</span>
        <div class="custom-dropdown-menu" id="traveler_type_menu" role="listbox" aria-label="{{ _('Visitor Type') }}">
          {% for value in details.visitor_categories %}
            <button type="button" class="custom-dropdown-item" data-value="{{ value }}">{{ value.replace('_', ' ') }}</button>
          {% endfor %}
        </div>
      </div>
      <div class="form-group col-md-12" id="id_number_wrapper" style="display: block;">
        <input id="id_number" name="id_number" type="text" class="form-control" placeholder="{{ _('Enter the Aadhar number') }}">
      </div>
      <div class="col-xs-12 buttons text-center">
        <button type="button" id="login" class="c-btn" style="width: 100%;">{{ _('Search') }}</button>
      </div>
      <div id="spinner" class="spinner-overlay" style="display: none">
        <div class="spinner"></div>
      </div>
    </form>
  </section>
  <script>
    $(document).ready(function(){
        const travelerTypeInput = $("#traveler_type");
        const travelerTypeMenu = $("#traveler_type_menu");

        function closeTravelerTypeMenu() {
          travelerTypeMenu.removeClass("open");
          travelerTypeInput.attr("aria-expanded", "false");
        }

        function syncTravelerTypeMenuWidth() {
          travelerTypeMenu.css({
            width: travelerTypeInput.outerWidth() + "px",
            left: travelerTypeInput.position().left + "px",
            top: (travelerTypeInput.outerHeight() + 4) + "px"
          });
        }

        travelerTypeInput.on("click", function() {
          syncTravelerTypeMenuWidth();
          travelerTypeMenu.toggleClass("open");
          travelerTypeInput.attr("aria-expanded", travelerTypeMenu.hasClass("open") ? "true" : "false");
        });

        $(window).on("resize", function() {
          if (travelerTypeMenu.hasClass("open")) {
            syncTravelerTypeMenuWidth();
          }
        });

        travelerTypeMenu.on("click", ".custom-dropdown-item", function() {
          travelerTypeInput.val($(this).data("value")).trigger("change");
          closeTravelerTypeMenu();
        });

        $(document).on("click", function(e) {
          if (!$(e.target).closest("#traveler_type_wrapper").length) {
            closeTravelerTypeMenu();
          }
        });

        $('#form input, #form select').keypress(function(e) {
          if (e.which == 13) {
            e.preventDefault();
            $('#login').trigger('click');
          }
        });

        $.validator.addMethod("validIDNumber", function(value, element) {
          let cleanedValue = value.replace(/[-\s]/g, "");
          if (!/^[A-Za-z0-9]+$/.test(cleanedValue)) {
                    $.validator.messages.validIDNumber = "{{ _('Aadhar number can only contain letters and numbers (no spaces or dashes).') }}";
                    return false;
                } else if (cleanedValue.length !== 12) {
                    $.validator.messages.validIDNumber = "{{ _('Aadhar number must be exactly 12 alphanumeric characters.') }}";
                    return false;
                }
                return true;
        }, function() {
            return $.validator.messages.validIDNumber;
        });
      $("#form").validate({
          rules: {
               traveler_type: {
                   required: true
                },
               id_number: {
                   required: true,
                   validIDNumber: true
               },
          },
          messages: {
               id_number: {
                   required: "{{ _('Please enter an ID number.') }}",
                   validIDNumber: "{{ _('ID must match the format for the selected type.') }}"
               }
          },
          errorPlacement: function(error, element) {
               error.css({
                   "font-size": "16px",
                   "color": "red",
                   "font-weight": "bold"
               }).insertAfter(element);
          }
      });
      $("#login").click(function() {
        if (!$("#form").valid()) {
          return false;
        }
        $("#spinner").css("display", "flex");
        $("#form")[0].submit();
      });
    });
  </script>
{% else %}
  <section class="user login_section" style="padding-top:2em">
    <form id="form" action="{{ url_for('aadhar_lookup') }}" class="login" method="post">
      <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">

      <div class="form-group col-md-12">
        <select name="traveler_type" id="traveler_type" class="form-control">
          <option value="">{{ _('Visitor Type') }}</option>
          {% for value in details.visitor_categories %}
              <option value="{{ value }}">{{ value.replace('_', ' ') }}</option>
          {% endfor %}
        </select>
      </div>

      <div class="form-group col-md-12" id="id_type_wrapper" style="display: block;">
        <select name="id_type" id="id_type" class="form-control">
          <option value="">{{ _('ID Type') }}</option>
          {% for value in details.id_categories %}
              <option value="{{ value }}">{{ value.replace('_', ' ') }}</option>
          {% endfor %}
        </select>
      </div>

      <div class="form-group col-md-12" id="id_number_wrapper" style="display: block;">
        <input id="id_number" name="id_number" type="text" class="form-control" placeholder="{{ _('Enter the id number') }}">
      </div>

      <div class="col-xs-12 buttons text-center">
        <button type="button" id="login" class="c-btn" style="width: 100%;">{{ _('Search') }}</button>
        {% if details.number_of_male_passengers_to_add > 0 %}
          <button type="button" id="skip" class="c-btn" style="width: 100%; background-color: red; color: white; border:none;" onclick="window.location.href='make_trip_summary'">{{ _('Skip') }}</button>
        {% endif %}
      </div>
      <div id="spinner" class="spinner-overlay" style="display: none">
        <div class="spinner"></div>
      </div>
    </form>
  </section>
  <script>
    document.addEventListener("DOMContentLoaded", function () {
        const travelerType = document.getElementById("traveler_type");
        const idTypeWrapper = document.getElementById("id_type_wrapper");
        const idType = document.getElementById("id_type");
        const idNumberWrapper = document.getElementById("id_number_wrapper");

        // Per-profile category groups injected from the active workflow config.
        const showIdNumberOnly = {{ show_id_number_only | tojson }};
        const showIdTypeFirst = {{ show_id_type_first | tojson }};

        function updateFields() {
            const selectedType = travelerType.value;
            console.log('traveler type: ', selectedType);

            $("#id_type").val("");
            $("#id_type option").show();

            if (["CIVILIAN", "PERMISSION", "GUEST", "OTHERS"].includes(selectedType)) {
                $("#id_type option[value='PASS']").hide();
            } else {
                $("#id_type option[value='PASS']").show();
            }

            if (showIdNumberOnly.includes(selectedType)) {
                idTypeWrapper.style.display = "none";
                idNumberWrapper.style.display = "block";
            } else if (showIdTypeFirst.includes(selectedType)) {
                idTypeWrapper.style.display = "block";
                idNumberWrapper.style.display = "none";
            } else {
                idTypeWrapper.style.display = "none";
                idNumberWrapper.style.display = "none";
            }
        }

        function showIdNumberField() {
            if (idType.value) {
                idNumberWrapper.style.display = "block";
            } else {
                idNumberWrapper.style.display = "none";
            }
        }

        travelerType.addEventListener("change", updateFields);
        idType.addEventListener("change", showIdNumberField);

        updateFields();
        showIdNumberField();
    });
    $(document).ready(function(){
        $('#form input, #form select').keypress(function(e) {
          if (e.which == 13) {
            e.preventDefault();
            $('#login').trigger('click');
          }
        });

        $.validator.addMethod("requireIDType", function(value, element) {
          let travelerType = $("#traveler_type").val();
          return travelerType === "TEACHER" || (value && value !== "");
        }, "Please select an ID Type.");

        $.validator.addMethod("validIDNumber", function(value, element) {
            let idType = $("#id_type").val();
            let cleanedValue = value.replace(/[-\s]/g, "");

            if (idType === "AADHAR") {
                if (!/^[A-Za-z0-9]+$/.test(cleanedValue)) {
                    $.validator.messages.validIDNumber = "Aadhar number can only contain letters and numbers (no spaces or dashes).";
                    return false;
                } else if (cleanedValue.length !== 12) {
                    $.validator.messages.validIDNumber = "Aadhar number must be exactly 12 alphanumeric characters.";
                    return false;
                }
                return true;
            }
            else if (idType === "DRIVERS LICENSE") {
                if (!/^[A-Za-z0-9]+$/.test(cleanedValue)) {
                    $.validator.messages.validIDNumber = "Driver's License number can only contain letters and numbers (excluding spaces and dashes).";
                    return false;
                } else if (cleanedValue.length !== 15) {
                    $.validator.messages.validIDNumber = "Driver's License number must be exactly 15 alphanumeric characters.";
                    return false;
                }
                return true;
            }
            else {
              return true;
            }
        }, function() {
            return $.validator.messages.validIDNumber;
        });

      $("#form").validate({
          rules: {
               traveler_type: {
                   required: true
                },
               id_number: {
                   required: true,
                   validIDNumber: true
               },
               id_type: {
                 requireIDType: true
               }
          },
          messages: {
              id_number: {
                  required: "Please enter an ID number.",
                  validIDNumber: "ID must match the format for the selected type."
              }
          },
          errorPlacement: function(error, element) {
               error.css({
                   "font-size": "16px",
                   "color": "red",
                   "font-weight": "bold"
               }).insertAfter(element);
          }
      });

      $("#login").click(function() {
        if (!$("#form").valid()) {
          return false;
        }
        $("#spinner").css("display", "flex");
        $("#form")[0].submit();
      });
    });
  </script>
{% endif %}
{% endblock content %}
